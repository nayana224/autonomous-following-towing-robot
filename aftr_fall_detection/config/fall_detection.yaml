fall_detection:
  ros__parameters:
    image_topic: "/camera/camera/color/image_raw"

    model_path: >-
      /models/fall_detection/yolov8n-pose.pt

    device: "cuda:0"
    confidence: 0.35
    keypoint_confidence: 0.35

    image_size: 640
    inference_hz: 4.0
    show_image: true

    # 쓰러짐 자세 판정 기준. 박스 비율만으로는 후보가 되지 않으며
    # 몸통 수평 조건을 반드시 만족해야 한다.
    torso_angle_threshold_deg: 55.0  # 기본 노드 호환용
    box_aspect_ratio_threshold: 0.95
    torso_height_ratio_threshold: 0.30
    critical_keypoint_confidence: 0.50
    full_torso_angle_threshold_deg: 60.0
    partial_torso_angle_threshold_deg: 70.0
    full_body_aspect_threshold: 0.80
    partial_upper_body_aspect_threshold: 1.0

    # 하체까지 보이면 1.5초, 상체만 보이면 2.0초 연속 확인한다.
    candidate_hold_seconds: 1.0  # 기본 노드 호환용
    full_candidate_hold_seconds: 1.5
    partial_candidate_hold_seconds: 2.0

    # 관절 일부가 잠깐 가려졌을 때 기존 상태를 유지하는 시간
    partial_pose_grace_seconds: 0.5

    # 사람 추적이 잠깐 끊겼을 때 ID와 상태를 유지하는 시간
    track_lost_grace_seconds: 0.75

    # 짧은 프레임 드롭은 허용하고, 3초 동안 RGB가 완전히 끊길 때만
    # STALE_IMAGE로 전환한다.
    image_timeout_seconds: 3.0

    # 사람 ID 매칭: 박스 겹침, 박스 대비 중심 이동, 면적 변화를 함께 사용한다.
    track_match_distance_ratio: 0.35
    track_match_iou_threshold: 0.10
    candidate_track_iou_threshold: 0.20
    track_match_area_ratio_min: 0.45
    track_match_area_ratio_max: 2.20

    # 현재 단계에서는 센서 오류를 보고만 하고 안전 래치에는 연결하지 않는다.
    # mode_manager 통합 검증 후 true 전환 여부를 결정한다.
    latch_sensor_fault: false
